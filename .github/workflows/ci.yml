name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # OIDC token for Workload Identity Federation (no JSON keys)

env:
  REGION: us-central1
  PROJECT: clutchwatch-bywa6u
  WIF_PROVIDER: projects/1039820844708/locations/global/workloadIdentityPools/github/providers/github-actions
  DEPLOYER: cw-deployer@clutchwatch-bywa6u.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build image (replay data is downloaded, not committed)
        run: |
          uv sync --frozen --no-dev
          SEASONS=2024 ./scripts/fetch_data.sh
          IMG=$REGION-docker.pkg.dev/$PROJECT/clutchwatch/pipeline:${GITHUB_SHA::7}
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet
          docker build -t "$IMG" .
          docker push "$IMG"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
      - name: Release to whatever is deployed (skips torn-down services)
        run: PROJECT=$PROJECT REGION=$REGION ./scripts/release.sh "$IMG"
